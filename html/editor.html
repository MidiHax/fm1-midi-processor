<script src="patch-codec.js"></script>
<script>
'use strict';
const C = PatchCodec;
const { PORTS, SYS, VOICE, REMAP, TRIG, LIM, msgKey } = C;
const EDIT = C.EDIT;

/* Timing: design/web-editor.md, "Sending" and "Read-back". */
const GAP_MS = 5, REPLY_IDLE_MS = 1500, OPEN_SETTLE_MS = 50, QUIET_MS = 100, STORE_MS_PER_SLOT = 100, ARM_MS = 5000, LIVE_MS = 150;
const NO_REPLY = 'No reply. Check ALLOW DUMP REQ and DEVICE ID on the Sysex Dump page.';
const STORE_KEY = 'fm1-patch-editor';

const NOTES = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
const note = n => NOTES[n % 12] + (Math.floor(n / 12) - 1);
const clone = o => JSON.parse(JSON.stringify(o));
const pad = (n, w) => String(n).padStart(w, '0');
const $ = id => document.getElementById(id);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const hex = a => a.map(v => v.toString(16).toUpperCase().padStart(2, '0')).join(' ');
class LinkError extends Error {}

/* ---- Documents ------------------------------------------------------------
 * One per source: the edit buffer, each slot, and any opened file. Each keeps
 * its draft (work), what the device last held (base) and its own undo. */
const docs = {};
function newDoc(patch, extra) {
  return { work: clone(patch), base: clone(patch), undo: [], redo: [], readOnly: false, read: false, ...extra };
}
docs.edit = newDoc(C.blankPatch(0));
for (let i = 0; i < C.PATCHES; i++) docs[i] = newDoc(C.blankPatch(i));

/* The bytes the device last gave for each source. */
const device = { edit: null, slots: Array(C.PATCHES).fill(null) };
const deviceBody = src => (src === 'edit' ? device.edit : device.slots[src]);

const S = {
  access: null, pairs: [], port: '', device: 0, answered: false, busy: false, livePending: false,
  armed: null, target: 0, notice: null, files: 0,
};
const ui = { src: 'edit', view: 'chf', port: 1, trig: 0, mrPort: -1, live: false };
let link = null;
let D = docs.edit, P = D.work;

const logLines = [];
function log(s) { logLines.push(s); if (logLines.length > 60) logLines.shift(); }
function say(sev, text) { S.notice = { sev, text }; if (sev === 'red') log('! ' + text); }

const SECTIONS = { chf: ['ch'], msgf: ['sys', 'voice'], trig: ['trig'], mr: ['msgRules'], cr: ['chRules'], ctl: ['knobs', 'live'] };
/* Compared the way the firmware stores them: rule order doesn't count. */
const sectionText = (p, k) => JSON.stringify(k === 'msgRules' ? [...p.msgRules].sort((a, b) => msgKey(a) - msgKey(b))
  : k === 'chRules' ? [...p.chRules].sort((a, b) => a.port - b.port || a.in - b.in) : p[k]);
const edited = (d, keys) => keys.some(k => sectionText(d.work, k) !== sectionText(d.base, k));
const isDirty = d => !C.sameBytes(C.encode(d.work), C.encode(d.base));
const dupRows = () => C.duplicateRules(P);
const problems = () => C.validate(P);
const hasErrors = patch => C.validate(patch).some(i => i.sev === 'red');
const slotLabel = src => (src === 'edit' ? 'EDIT BUFFER' : typeof src === 'number' ? 'SLOT ' + pad(src + 1, 2) : 'FILE');

function mutate(fn) {
  if (D.readOnly) { say('amber', 'This patch comes from a newer firmware, so it opens read-only.'); render(); return; }
  D.undo.push(JSON.stringify(P));
  if (D.undo.length > 200) D.undo.shift();
  D.redo = [];
  fn();
  disarm();
  render();
  saveDrafts();
  if (ui.live) scheduleLive();
}

/* ---- Browser storage: a draft survives a closed tab ------------------------ */
let saveTimer = 0;
function saveDrafts() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    try {
      const drafts = {};
      Object.entries(docs).forEach(([k, d]) => { if (isDirty(d)) drafts[k] = { work: d.work, base: d.base, name: d.name, slot: d.slot }; });
      localStorage.setItem(STORE_KEY, JSON.stringify({ device: S.device, port: S.port, drafts }));
    } catch (e) { /* storage unavailable: the page works without it */ }
  }, 300);
}
function loadDrafts() {
  try {
    const saved = JSON.parse(localStorage.getItem(STORE_KEY) || 'null');
    if (!saved) return;
    S.device = saved.device | 0;
    S.port = saved.port || '';
    let n = 0;
    Object.entries(saved.drafts || {}).forEach(([k, v]) => {
      if (!docs[k]) { docs[k] = newDoc(v.base, { name: v.name, slot: v.slot }); S.files++; }
      docs[k].work = v.work;
      docs[k].base = v.base;
      n++;
    });
    if (n) say('amber', `Recovered edits to ${n} ${n === 1 ? 'patch' : 'patches'} from your last visit.`);
  } catch (e) { /* unreadable: start clean */ }
}

/* ---- MIDI link ------------------------------------------------------------ */
class Link {
  constructor(pair) {
    this.input = pair.input; this.output = pair.output; this.name = pair.name;
    this.listener = null; this.abort = null;
    this.onMessage = ev => { if (this.listener) this.listener(Array.from(ev.data)); };
    this.input.addEventListener('midimessage', this.onMessage);
  }
  get lost() { return this.input.state === 'disconnected' || this.output.state === 'disconnected'; }
  send(bytes, at) { if (this.lost) throw new LinkError('The USB connection was lost.'); this.output.send(bytes, at); }
  async close() {
    this.input.removeEventListener('midimessage', this.onMessage);
    await Promise.allSettled([this.input.close(), this.output.close()]);
  }
}

function listPairs() {
  const ins = [...S.access.inputs.values()].filter(p => p.state === 'connected');
  const outs = [...S.access.outputs.values()].filter(p => p.state === 'connected');
  return ins.flatMap(input => {
    const output = outs.find(o => o.name === input.name);
    return output ? [{ input, output, name: input.name }] : [];
  });
}
function choosePair() {
  S.pairs = listPairs();
  if (!S.pairs.length) throw new LinkError('No MIDI ports found. Connect the FM-1 over USB, close other MIDI programs and press Connect.');
  const named = S.pairs.filter(p => /usb-?midi/i.test(p.name));
  const picked = S.pairs.find(p => p.name === S.port);
  if (picked) return picked;
  if (named.length === 1) return named[0];
  if (S.pairs.length === 1) return S.pairs[0];
  S.port = S.port || (named[0] || S.pairs[0]).name;
  throw new LinkError('Several MIDI ports are available. Choose the FM-1 in the list and press Connect.');
}

/* Waits for the wanted slots. The timeout runs from the last packet, because
 * the FM-1 slows its replies while MIDI is busy. */
function collect(wanted) {
  return new Promise((resolve, reject) => {
    const got = new Map(), assembler = new C.Assembler();
    let timer = 0;
    const finish = err => { clearTimeout(timer); link.listener = null; link.abort = null; if (err) reject(err); else resolve(got); };
    const arm = () => { clearTimeout(timer); timer = setTimeout(() => finish(new LinkError(NO_REPLY)), REPLY_IDLE_MS); };
    link.abort = finish;
    link.listener = m => {
      if (!C.isDump(m, S.device)) return; /* other traffic, or a request echoed back */
      arm();
      try {
        const done = assembler.feed(m);
        if (done && wanted.has(done.slot)) { got.set(done.slot, done.body); if (got.size === wanted.size) finish(); }
      } catch (e) { finish(e); }
    };
    arm();
  });
}
async function exchange(wanted, message) {
  for (let attempt = 0; ; attempt++) {
    const wait = collect(wanted);
    link.send(message);
    try { return await wait; }
    catch (e) { if (attempt || e.message !== NO_REPLY) throw e; } /* a request during another reply gets no answer */
  }
}
const requestOne = async slot => (await exchange(new Set([slot]), C.request(S.device, slot))).get(slot);
const requestAll = () => exchange(new Set(Array.from({ length: C.PATCHES }, (_, i) => i)), C.requestAll(S.device));
async function requestEach(slots) {
  const out = new Map();
  for (const s of slots) out.set(s, await requestOne(s));
  return out;
}

async function sendBody(slot, body, verb) {
  const pk = C.packets(slot, body, S.device);
  const t0 = performance.now() + 2; /* timestamps keep the gaps even in a background tab */
  pk.forEach((m, i) => link.send(m, t0 + i * GAP_MS));
  log(`> ${verb}  ${pk.length} PKT  ${body.length} B\n  ${hex(pk[0].slice(0, 8))} ...`);
  await sleep(pk.length * GAP_MS + 30);
}

/* Store a read patch. A draft with edits keeps them: only its base moves. */
function applyRead(src, body) {
  const key = src === EDIT ? 'edit' : src;
  let decoded;
  try { decoded = C.decode(body); }
  catch (e) { say('red', `${slotLabel(key)}: ${e.message}`); return false; }
  if (key === 'edit') device.edit = body; else device.slots[key] = body;
  const d = docs[key];
  if (isDirty(d)) d.base = clone(decoded.patch);
  else { d.work = clone(decoded.patch); d.base = clone(decoded.patch); d.undo = []; d.redo = []; }
  d.read = true; d.readOnly = decoded.readOnly;
  return true;
}

function clearLink(message) {
  if (link) { if (link.abort) link.abort(new LinkError(message)); link.close(); }
  link = null; S.answered = false;
}

/* ---- Device operations: one at a time -------------------------------------- */
function safeRender() {
  const a = document.activeElement;
  if (a && a.matches('#view input:not([type=checkbox])')) renderChrome(); else render();
}
async function run(fn) {
  if (S.busy) return;
  S.busy = true;
  disarm();
  safeRender();
  try { await fn(); }
  catch (e) { say('red', e.message); }
  finally {
    S.busy = false;
    safeRender();
    saveDrafts();
    if (S.livePending) { S.livePending = false; liveSend(); }
  }
}

async function readEverything() {
  say('info', 'Reading the FM-1…');
  safeRender();
  applyRead(EDIT, await requestOne(EDIT));
  S.answered = true;
  const all = await requestAll();
  all.forEach((body, slot) => applyRead(slot, body));
  log(`> READ EDIT BUFFER, ${all.size} SLOTS`);
  say('ok', `Connected to ${link.name}, Device ID ${S.device}. Read the edit buffer and ${all.size} slots.`);
}

function connect() {
  if (link) {
    clearLink('Disconnected.');
    say('info', 'Disconnected.');
    render();
    return;
  }
  run(async () => {
    if (!S.access) {
      say('info', 'Allow MIDI and SysEx access when the browser asks.');
      safeRender();
      try { S.access = await navigator.requestMIDIAccess({ sysex: true }); }
      catch (e) { throw new LinkError('The browser refused MIDI access. Allow MIDI for this site and press Connect again.'); }
      S.access.addEventListener('statechange', () => {
        if (link && link.lost) { clearLink('The USB connection was lost.'); say('red', 'The USB connection was lost. Reconnect it and press Connect.'); safeRender(); }
      });
    }
    const pair = choosePair();
    S.port = pair.name;
    try { await pair.input.open(); await pair.output.open(); }
    catch (e) { throw new LinkError(`Cannot open "${pair.name}". Close other MIDI programs and try again.`); }
    link = new Link(pair);
    await sleep(OPEN_SETTLE_MS); /* Windows can drop a reply to a message sent at once */
    log(`> PORT ${pair.name}  DEVICE ID ${pad(S.device, 3)}`);
    await readEverything();
  });
}

/* Tries every Device ID. The wrong ones aren't recognised, so they pass through
 * the pipeline and show on the monitor, which is why this is only on request. */
function findDevice() {
  run(async () => {
    say('info', 'Trying all 128 Device IDs. They will appear on the FM-1 monitor.');
    safeRender();
    const found = new Promise(resolve => {
      const timer = setTimeout(() => { link.listener = null; resolve(-1); }, 128 * GAP_MS + REPLY_IDLE_MS);
      link.listener = m => { if (C.isDump(m)) { clearTimeout(timer); link.listener = null; resolve(m[2]); } };
    });
    const t0 = performance.now() + 2;
    for (let id = 0; id < 128; id++) link.send(C.request(id, EDIT), t0 + id * GAP_MS);
    const id = await found;
    if (id < 0) throw new LinkError('No Device ID answered. Set ALLOW DUMP REQ to YES on the Sysex Dump page.');
    S.device = id;
    log(`> FOUND DEVICE ID ${pad(id, 3)}`);
    await sleep(128 * GAP_MS + 200); /* let the probes and the reply finish */
    await readEverything();
  });
}

async function tryPatch(readBack) {
  const body = C.encode(P);
  await sendBody(EDIT, body, readBack ? 'TRY TO EDIT BUFFER' : 'LIVE TO EDIT BUFFER');
  if (readBack) {
    const back = await requestOne(EDIT);
    if (!C.sameBytes(back, body)) throw new LinkError('The FM-1 did not take this patch: what it holds now is different.');
    say('ok', 'Trying this patch on the FM-1. Nothing is stored yet.');
  }
  applyRead(EDIT, body);
}

/* Stops if the device's copy changed since it was read. The new copy is then
 * remembered, so pressing Write again overwrites it. */
async function staleSlots(slots) {
  const now = await requestEach(slots), changed = [];
  now.forEach((body, s) => {
    if (device.slots[s] && !C.sameBytes(body, device.slots[s])) changed.push(s);
    device.slots[s] = body;
  });
  return changed;
}
const slotList = list => list.map(s => pad(s + 1, 2)).join(', ');

async function verifyWrites(written) {
  await sleep(QUIET_MS + STORE_MS_PER_SLOT * written.size);
  const back = await requestEach([...written.keys()]);
  const bad = [...written.keys()].filter(s => !C.sameBytes(back.get(s), written.get(s)));
  if (bad.length) throw new LinkError(`Read-back failed for slot ${slotList(bad)}: what it holds now is different from what was sent.`);
  written.forEach((body, s) => { applyRead(s, body); log(`  READ BACK ${pad(s + 1, 2)}: MATCH`); });
  /* If a written slot was the one in use, the edit buffer changed too. */
  applyRead(EDIT, await requestOne(EDIT));
}

async function writeSlot(t) {
  const body = C.encode(P);
  say('info', `Writing slot ${pad(t + 1, 2)}…`);
  safeRender();
  const changed = await staleSlots([t]);
  if (changed.length) { say('amber', `Slot ${pad(t + 1, 2)} changed on the FM-1 since it was read. Nothing was written. Press Write again to overwrite it.`); return; }
  await sendBody(t, body, `WRITE SLOT ${pad(t + 1, 2)}`);
  await verifyWrites(new Map([[t, body]]));
  say('ok', `Stored in slot ${pad(t + 1, 2)} and read back.`);
}

async function writeChanged(slots) {
  say('info', `Writing ${slots.length} slots…`);
  safeRender();
  const changed = await staleSlots(slots);
  if (changed.length) { say('amber', `Slot ${slotList(changed)} changed on the FM-1 since it was read. Nothing was written. Press Write changed again to overwrite.`); return; }
  const written = new Map();
  for (const s of slots) {
    const body = C.encode(docs[s].work);
    await sendBody(s, body, `WRITE SLOT ${pad(s + 1, 2)}`);
    written.set(s, body);
  }
  await verifyWrites(written);
  say('ok', `Stored ${slots.length} slots and read them back.`);
}

function download(name, bytes) {
  const url = URL.createObjectURL(new Blob([bytes], { type: 'application/octet-stream' }));
  const a = document.createElement('a');
  a.href = url; a.download = name;
  a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
async function openFile(file) {
  const parsed = C.parseSyx(new Uint8Array(await file.arrayBuffer()));
  if (parsed.errors.length && !parsed.patches.length) { say('red', `${file.name}: ${parsed.errors[0]}`); render(); return; }
  const decoded = [];
  for (const item of parsed.patches) {
    try { decoded.push({ ...item, ...C.decode(item.body) }); }
    catch (e) { say('red', `${file.name}, patch ${item.slot}: ${e.message}`); render(); return; }
  }
  if (decoded.length === 1) {
    const key = 'f' + (++S.files);
    docs[key] = newDoc(decoded[0].patch, { name: file.name, slot: decoded[0].slot, readOnly: decoded[0].readOnly, read: true });
    openDoc(key);
    say('ok', `Opened ${file.name}. Nothing is sent until you press Try or Write.`);
  } else {
    decoded.forEach(item => {
      const d = docs[item.slot === EDIT ? 'edit' : item.slot];
      d.undo.push(JSON.stringify(d.work));
      d.redo = [];
      d.work = clone(item.patch);
    });
    say('ok', `Loaded ${decoded.length} patches from ${file.name} as edits. Press Write changed to send them.`);
  }
  if (parsed.errors.length) say('amber', `${file.name}: some packets were bad. ${parsed.errors[0]}`);
  render();
  saveDrafts();
}
function saveFile() {
  const slot = ui.src === 'edit' ? EDIT : typeof ui.src === 'number' ? ui.src : D.slot;
  const name = P.name.trim().replace(/[^A-Z0-9-]+/g, '-') || 'PATCH';
  download(`FM1-${name}.syx`, C.buildSyx([{ slot, body: C.encode(P) }], S.device));
  log(`> SAVED FM1-${name}.syx`);
  render();
}
function saveBank() {
  const bad = Array.from({ length: C.PATCHES }, (_, i) => i).filter(i => hasErrors(docs[i].work));
  if (bad.length) { say('red', `Slot ${slotList(bad)} has errors. Fix them before saving the bank.`); render(); return; }
  const items = Array.from({ length: C.PATCHES }, (_, i) => ({ slot: i, body: C.encode(docs[i].work) }));

}

const num = (path, v, kind, label) => `<input class="crt-field" id="${pid(path)}" data-b="${path}" data-k="${kind}" value="${show(kind, v)}" inputmode="${kind === 'n' || kind === 'prog' ? 'numeric' : 'text'}" autocomplete="off" aria-label="${label}">`;

function parse(kind, raw) {
  const s = raw.trim().toUpperCase();
  if (kind === 'in' && s === 'IN') return 128;
  if (kind === 'off' && (s === '' || s === 'OFF')) return -1;
  const n = parseInt(s, 10);
  if (Number.isNaN(n)) return null;
  const c = (lo, hi) => Math.min(hi, Math.max(lo, n));
  switch (kind) {
    case 'prog': return Math.min(127, Math.max(0, n - 1));
    case 'cc': return c(0, 119);

    case 'oct': return c(-3, 3);

  }
}

  const row = (src, num, name, named) => {
    const edits = isDirty(docs[src]);
    return `<button class="slot" id="slot-${src}" data-a="open" data-s="${src}" aria-current="${ui.src === src}"><b>${num}</b><span class="${named ? 'named' : ''}">${esc(name)}</span><span class="crt-led ${edits ? 'amber' : 'off'}" title="${edits ? 'Edited' : 'Same as device'}"></span></button>`;
  };
  const nameOf = s => docs[s].work.name.trim() || '(no name)';
  let h = row('edit', 'ED', nameOf('edit'), true);
  for (let i = 0; i < C.PATCHES; i++) { const d = nameOf(i); h += row(i, pad(i + 1, 2), d, !/^PATCH \d\d$/.test(d)); }
  Object.keys(docs).filter(k => k[0] === 'f').forEach(k => { h += row(k, 'FI', nameOf(k), true); });
  $('bank').innerHTML = h;
}
function changedSlots() {
  return Array.from({ length: C.PATCHES }, (_, i) => i).filter(i => isDirty(docs[i]));
}
function renderActions() {
  const errs = hasErrors(P) || D.readOnly;
  const can = link && S.answered && !S.busy;
  const canRead = can && (ui.src === 'edit' || typeof ui.src === 'number');
  const where = typeof ui.src === 'string' && ui.src[0] === 'f' ? 'FILE ' + D.name : slotLabel(ui.src);
  const a = $('pname');
  if (document.activeElement !== a) a.value = P.name.trimEnd();
  a.disabled = D.readOnly;
  $('actions').innerHTML = `<span class="crt-badge">${esc(where)}${isDirty(D) ? ' *' : ''}${D.readOnly ? ' · READ-ONLY' : ''}</span><button class="crt-btn" id="a-read" data-a="read"${canRead ? '' : ' disabled'} aria-pressed="${S.armed === 'read'}">${S.armed === 'read' ? 'Read again' : 'Read'}</button><button class="crt-btn" id="a-undo" data-a="undo"${D.undo.length ? '' : ' disabled'}>Undo</button><button class="crt-btn" id="a-redo" data-a="redo"${D.redo.length ? '' : ' disabled'}>Redo</button><span class="spacer"></span><label class="crt-switch"><input type="checkbox" id="a-live" data-a2="live"${ui.live ? ' checked' : ''}${link && S.answered ? '' : ' disabled'}><span class="crt-switch-track"></span> Live</label><button class="crt-btn crt-btn-primary" id="a-try" data-a="try"${can && !errs ? '' : ' disabled'}>Try</button><select class="crt-field target" id="a-target" data-s2="target" aria-label="Slot to write">${Array.from({ length: C.PATCHES }, (_, i) => `<option value="${i}"${i === S.target ? ' selected' : ''}>Slot ${pad(i + 1, 2)}</option>`).join('')}</select><button class="crt-btn crt-btn-danger" id="a-write" data-a="write"${can && !errs ? '' : ' disabled'} aria-pressed="${S.armed === 'write'}">${S.armed === 'write' ? '<span class="crt-led red blink"></span> Write again' : 'Write to slot'}</button>`;
}
function renderNotice() {
  const n = S.notice;
  const led = !n ? 'off' : n.sev === 'ok' ? '' : n.sev === 'info' ? (S.busy ? 'blink' : '') : n.sev;
  const fallback = navigator.requestMIDIAccess ? 'Press Connect to read your FM-1, or open a .syx file.' : 'This browser has no Web MIDI, so it can\'t reach the FM-1. Use desktop Chrome or Edge to connect. You can still open and edit .syx files.';
  $('notice').innerHTML = `<span class="crt-led ${led}"></span><span>${esc(n ? n.text : fallback)}</span>`;
}
function summary(k) {
  const bits = v => v.toString(2).replace(/0/g, '').length;
  const blockedCh = PORTS.reduce((n, _, p) => n + (16 - bits(P.ch[p])), 0);
  const blockedMsg = P.voice.reduce((n, port) => n + port.reduce((m, v) => m + (7 - bits(v)), 0), 0) + P.sys.reduce((n, s) => n + (10 - bits(s)), 0);
  return { chf: blockedCh ? blockedCh + ' blocked' : 'all pass', msgf: blockedMsg ? blockedMsg + ' blocked' : 'all pass', trig: P.trig.length + ' / ' + P.trig.reduce((n, t) => n + t.msgs.length, 0) + ' msgs', mr: P.msgRules.length + ' rules', cr: P.chRules.length + ' rules', ctl: '4 knobs' }[k];
}
function renderPipe() {
  const step = (k, t, cls = '') => `<button class="step ${cls}" id="p-${k}" data-a="view" data-v="${k}" aria-pressed="${ui.view === k}"><span class="t">${t}<span class="crt-led ${edited(D, SECTIONS[k]) ? 'amber' : 'off'}"></span></span><span class="s">${summary(k)}</span></button>`;
  const w = '<span class="wire"></span>';
  $('pipe').innerHTML = `<div class="node"><strong>IN</strong>TRS USB</div>${w}${step('chf', 'Ch filter')}${w}${step('msgf', 'Msg filter')}${w}${step('trig', 'Triggers')}${w}${step('mr', 'Msg remap')}${w}${step('cr', 'Ch remap')}${w}<div class="node"><strong>OUT</strong>USB</div>${step('ctl', 'Knobs + keys', 'apart')}`;
}
function renderSide() {
  const body = C.encode(P), pk = C.packets(0, body, 0).length, msgs = P.trig.reduce((n, t) => n + t.msgs.length, 0);
  const row = (t, v, max) => {
    const lit = v ? Math.max(1, Math.ceil(v / max * 20)) : 0;
    return `<div><div class="r"><span>${t}</span><span>${v} / ${max}</span></div><div class="crt-meter" role="img" aria-label="${t}: ${v} of ${max}">${Array.from({ length: 20 }, (_, i) => `<i class="${i < lit ? 'on' : ''}"></i>`).join('')}</div></div>`;
  };
  $('cap').innerHTML = row('Patch bytes', body.length, LIM.body) + row('SysEx packets', pk, LIM.packets) + row('Message rules', P.msgRules.length, LIM.msgRules) + row('Channel rules', P.chRules.length, LIM.chRules) + row('Triggers', P.trig.length, LIM.trig) + row('Trigger messages', msgs, LIM.allMsgs);
  const list = problems();
  $('issues').innerHTML = list.length ? list.map(i => `<li><span class="crt-led ${i.sev}"></span><span>${esc(i.text)}</span></li>`).join('') : '<li><span class="crt-led"></span><span>None. The FM-1 will accept this patch.</span></li>';
  const l = $('log');
  l.textContent = logLines.join('\n') || '> Nothing sent yet.';
  l.scrollTop = l.scrollHeight;
}
function renderChrome() {
  P = D.work;
  renderConn(); renderBank(); renderActions(); renderNotice(); renderPipe(); renderSide();
}
function render() {
  const a = document.activeElement, focusId = a && a.id;
  renderChrome();
  $('vt').textContent = VIEWS[ui.view][0];
  $('view').innerHTML = VIEWS[ui.view][1]();
  if (focusId && $(focusId) && $(focusId) !== a) $(focusId).focus({ preventScroll: true });
}

/* ---- Events ----------------------------------------------------------------- */
function openDoc(key) {
  ui.src = key;
  D = docs[key];
  disarm();
  if (typeof key === 'number') S.target = key;
  render();
}
const toggleBit = (arr, i, bit) => { arr[i] ^= 1 << bit; };
const ACT = {
  connect, find: findDevice,
  open: e => { const s = e.dataset.s; openDoc(/^\d+$/.test(s) ? +s : s); },
  view: e => { ui.view = e.dataset.v; render(); },
  port: e => { ui.port = +e.dataset.i; render(); },
  openfile: () => $('file').click(),
  savefile: saveFile,
  savebank: saveBank,
  readall: () => run(readEverything),
  read: () => {
    if (isDirty(D) && S.armed !== 'read') { arm('read', 'Read again to discard the edits to this patch.'); return; }
    disarm();
    const src = ui.src, doc = D;
    run(async () => {
      const body = await requestOne(src === 'edit' ? EDIT : src);
      doc.undo.push(JSON.stringify(doc.work));
      doc.work = clone(doc.base);
      const undo = doc.undo;
      applyRead(src === 'edit' ? EDIT : src, body);
      doc.undo = undo;
      say('ok', `Read ${slotLabel(src).toLowerCase()} from the FM-1.`);
    });
  },
  undo: () => { D.redo.push(JSON.stringify(P)); D.work = JSON.parse(D.undo.pop()); render(); saveDrafts(); },
  redo: () => { D.undo.push(JSON.stringify(P)); D.work = JSON.parse(D.redo.pop()); render(); saveDrafts(); },
  try: () => run(() => tryPatch(true)),
  write: () => {
    if (S.armed !== 'write') { arm('write', `Press Write again to store this in slot ${pad(S.target + 1, 2)}. If that slot is the patch in use on the FM-1, unsaved panel edits are lost.`); return; }
    disarm();
    const t = S.target;
    run(() => writeSlot(t));
  },
  writeall: () => {
    const slots = changedSlots();
    const bad = slots.filter(i => hasErrors(docs[i].work) || docs[i].readOnly);
    if (bad.length) { say('red', `Slot ${slotList(bad)} can't be written. Fix its errors first.`); render(); return; }
    if (S.armed !== 'bank') { arm('bank', `Press Write changed again to store slots ${slotList(slots)}. If one is the patch in use on the FM-1, unsaved panel edits are lost.`); return; }
    disarm();
    run(() => writeChanged(slots));
  },
  chf: e => mutate(() => toggleBit(P.ch, +e.dataset.p, +e.dataset.c)),
  chfall: e => mutate(() => { P.ch[+e.dataset.p] = +e.dataset.v; }),
  sys: e => mutate(() => toggleBit(P.sys, ui.port, +e.dataset.i)),
  voice: e => mutate(() => toggleBit(P.voice[ui.port], +e.dataset.c, +e.dataset.t)),
  voicerow: e => mutate(() => { const t = +e.dataset.t, v = P.voice[ui.port], on = v.every(x => x >> t & 1); v.forEach((x, c) => { v[c] = on ? x & ~(1 << t) : x | 1 << t; }); }),
  voicecol: e => mutate(() => { const c = +e.dataset.c, v = P.voice[ui.port]; v[c] = v[c] === 0x7f ? 0 : 0x7f; }),
  mradd: () => mutate(() => {
    const port = ui.mrPort < 0 ? 1 : ui.mrPort;
    const taken = new Set(P.msgRules.filter(r => r.port === port && r.ch === 0 && r.type === 0).map(r => r.in));
    let v = 60;
    while (taken.has(v) && v < 127) v++;
    P.msgRules.push({ port, ch: 0, type: 0, in: v, out: v, outCh: 0 });
  }),
  mrdel: e => mutate(() => P.msgRules.splice(+e.dataset.i, 1)),
  route: e => mutate(() => { const i = +e.dataset.i, o = +e.dataset.o, at = P.chRules.findIndex(r => r.port === ui.port && r.in === i); if (at >= 0 && P.chRules[at].out === o) P.chRules.splice(at, 1); else if (at >= 0) P.chRules[at].out = o; else P.chRules.push({ port: ui.port, in: i, out: o }); }),
  tsel: e => { ui.trig = +e.dataset.i; render(); },
  tadd: () => mutate(() => { P.trig.push({ port: 1, ch: 0, type: 3, d1: [0, 127], d2: [0, 127], pass: true, enter: true, msgs: [] }); ui.trig = P.trig.length - 1; }),
  tdel: () => mutate(() => P.trig.splice(ui.trig, 1)),
  tmove: e => mutate(() => { const a = ui.trig, b = a + +e.dataset.d, l = P.trig; [l[a], l[b]] = [l[b], l[a]]; ui.trig = b; }),
  madd: () => mutate(() => P.trig[ui.trig].msgs.push({ type: 2, ch: 0, d1: 0, d2: 0 })),
  mdup: e => mutate(() => { const m = P.trig[ui.trig].msgs, i = +e.dataset.i; m.splice(i + 1, 0, clone(m[i])); }),
  mdel: e => mutate(() => P.trig[ui.trig].msgs.splice(+e.dataset.i, 1)),
};
document.addEventListener('click', ev => { const e = ev.target.closest('[data-a]'); if (e && !e.disabled) ACT[e.dataset.a](e); });
document.addEventListener('change', ev => {
  const e = ev.target;
  if (e.id === 'file') { if (e.files[0]) openFile(e.files[0]); e.value = ''; return; }
  if (e.id === 'pname') { const n = C.cleanName(e.value); mutate(() => { P.name = n; }); return; }
  if (e.dataset.s2 === 'device') { const v = parseInt(e.value, 10); S.device = Number.isNaN(v) ? S.device : Math.min(127, Math.max(0, v)); saveDrafts(); render(); return; }
  if (e.dataset.s2 === 'port') { S.port = e.value; saveDrafts(); return; }
  if (e.dataset.s2 === 'target') { S.target = +e.value; disarm(); render(); return; }
  if (e.dataset.ui) { ui[e.dataset.ui] = +e.value; render(); return; }
  if (e.dataset.a2 === 'live') { ui.live = e.checked; log(ui.live ? '> LIVE ON' : '> LIVE OFF'); render(); return; }
  if (e.dataset.a2) { const k = e.dataset.a2, c = e.checked; mutate(() => { P.trig[ui.trig][k] = c; }); return; }
  if (e.dataset.b) { const v = parse(e.dataset.k, e.value); if (v === null) { render(); return; } mutate(() => setPath(e.dataset.b, v)); }
});
document.addEventListener('input', ev => {
  if (ev.target.id !== 'pname') return;
  const s = ev.target.selectionStart;
  ev.target.value = ev.target.value.toUpperCase().replace(/[^A-Z0-9 -]/g, '');
  ev.target.setSelectionRange(s, s);
});
loadDrafts();
render();
</script>
</body>
